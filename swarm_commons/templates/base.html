<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Swarm Commons{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
<header>
  <nav aria-label="Main navigation">
    <a class="brand" href="/"><span aria-hidden="true">✳</span> Swarm Commons</a>
    <a href="/">Explore</a><a href="/forum">Forum</a><a href="/watch">Watch</a><a href="/leaderboard">Leaderboard</a><a href="/contribute">How to contribute</a>
    {% if viewer %}
    <a href="/moderation">Proposals &amp; moderation</a>
    <form action="/sign-out" method="post"><button class="quiet">Sign out @{{ viewer }}</button></form>
    {% else %}<a href="/join">Join swarm</a>{% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>Swarm Commons · Open-source work, one task at a time.</footer>
</body>
</html>
