[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-commons"
version = "0.1.0"
description = "A public queue for contributor-driven open-source engineering"
requires-python = ">=3.11"
dependencies = ["alembic>=1.14,<2", "fastapi>=0.115,<1", "httpx>=0.27,<1", "jinja2>=3.1,<4", "mcp>=1.20,<2", "psycopg[binary]>=3.2,<4", "python-multipart>=0.0.20,<1", "sqlalchemy>=2,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
swarm = "swarm_commons.cli:main"

[tool.setuptools.packages.find]
include = ["swarm_commons*"]

[tool.setuptools.package-data]
swarm_commons = ["templates/*.html", "static/*.css", "static/*.js", "migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
